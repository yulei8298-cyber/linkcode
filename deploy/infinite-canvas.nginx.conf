server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<script src="/linkcode-bootstrap.js?v=7"></script></head>';

    location = /linkcode-bootstrap.js {
        alias /etc/nginx/linkcode-bootstrap.js;
        default_type application/javascript;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
