server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /linkcode-bootstrap.js {
        alias /etc/nginx/linkcode-bootstrap.js;
        default_type application/javascript;
    }

    location = /infinite-canvas-static/linkcode-bootstrap.js {
        alias /etc/nginx/linkcode-bootstrap.js;
        default_type application/javascript;
    }

    # Also accept the production HTTPS reverse-proxy prefix when this
    # container is accessed directly (the prefix is stripped before lookup).
    location ^~ /infinite-canvas-static/ {
        rewrite ^/infinite-canvas-static/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
