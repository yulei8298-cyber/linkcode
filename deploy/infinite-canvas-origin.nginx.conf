# Production-only HTTPS bridge for the embedded static canvas.
# Include/install this server block on the LinkCode origin host. Edge Nginx
# already forwards api-fast.linkcode.site to 10.88.0.1:80.
server {
    listen 10.88.0.1:80;
    server_name api-fast.linkcode.site;

    allow 10.88.0.2;
    allow 10.88.0.5;
    allow 10.88.0.6;
    allow 10.88.0.7;
    deny all;

    # The browser-visible URL is HTTPS at the edge; this hop is local HTTP.
    location ^~ /infinite-canvas-static/ {
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The upstream build has a few absolute runtime asset URLs. Keep those
    # assets on the api-fast host without changing the LinkCode web app host.
    location ^~ /assets/ { proxy_pass http://127.0.0.1:18082; }
    location ^~ /icons/ { proxy_pass http://127.0.0.1:18082; }
    location ^~ /plugins/ { proxy_pass http://127.0.0.1:18082; }
    location = /logo.svg { proxy_pass http://127.0.0.1:18082/logo.svg; }
    location = /config.js { proxy_pass http://127.0.0.1:18082/config.js; }
    location = /linkcode-bootstrap.js { proxy_pass http://127.0.0.1:18082/linkcode-bootstrap.js; }

    # All API and non-canvas traffic remains on the existing gateway.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
