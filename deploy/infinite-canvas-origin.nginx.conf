# Production-only HTTPS bridge for the embedded static canvas.
# Include/install this server block on the LinkCode origin host. Edge Nginx
# already forwards api-fast.linkcode.site to 10.88.0.1:80.
server {
    listen 10.88.0.1:80;
    server_name api-fast.linkcode.site;

    allow 10.88.0.2;
    allow 10.88.0.5;
    allow 10.88.0.6;
    allow 10.88.0.7;
    deny all;

    # The browser-visible URL is HTTPS at the edge; this hop is local HTTP.
    location ^~ /infinite-canvas-static/ {
        proxy_pass http://127.0.0.1:18082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Provide a readable public canvas entry point on api-fast as well as the
    # prefixed static path used by the LinkCode iframe.
    location = /infinite-canvas {
        return 302 https://api-fast.linkcode.site/infinite-canvas-static/?linkcodeEmbed=8;
    }
    location = /infinite-canvas/ {
        return 302 https://api-fast.linkcode.site/infinite-canvas-static/?linkcodeEmbed=8;
    }

    # The upstream build has a few absolute runtime asset URLs. Keep those
    # assets on the api-fast host without changing the LinkCode web app host.
    location ^~ /assets/ { proxy_pass http://127.0.0.1:18082; }
    location ^~ /icons/ { proxy_pass http://127.0.0.1:18082; }
    location ^~ /plugins/ { proxy_pass http://127.0.0.1:18082; }
    location = /logo.svg { proxy_pass http://127.0.0.1:18082/logo.svg; }
    location = /config.js { proxy_pass http://127.0.0.1:18082/config.js; }
    location = /linkcode-bootstrap.js { proxy_pass http://127.0.0.1:18082/linkcode-bootstrap.js; }

    # The upstream canvas uses a browser router and normalizes its embedded
    # document back to `/`. Keep that document on the static canvas service
    # when the embed marker is present, while ordinary API-host root traffic
    # continues to use the LinkCode web app below.
    location = / {
        error_page 418 = @infinite_canvas_embed_root;
        if ($arg_linkcodeEmbed != "") { return 418; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @infinite_canvas_embed_root {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All API and non-canvas traffic remains on the existing gateway.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
