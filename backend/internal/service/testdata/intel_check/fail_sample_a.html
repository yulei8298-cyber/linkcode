<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root { color-scheme: light; background: #dff2f0; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #dff2f0; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    svg { width: 100%; height: 100%; display: block; }
    .ink { stroke: #24383b; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .soft-shadow { filter: url(#shadow); }
  </style>
</head>
<body>
  <main aria-label="鹈鹕骑自行车的二维 SVG 动画">

      <desc id="desc">一只戴红围巾的鹈鹕沿着海边骑自行车，车轮旋转，双腿交替踩踏，云朵和路面向后移动。</desc>
      <defs>

        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd0d2"/>
          <stop offset="1" stop-color="#56abb7"/>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#183c42" flood-opacity=".18"/>
        </filter>
        <g id="cloud" fill="#fffdf4" opacity=".9">
          <path d="M0 35c0-13 11-23 25-23 6-18 33-20 43-3 7-7 18-11 29-7 12 4 18 15 18 28h12c10 0 18 7 18 15H0z"/>
        </g>
        <g id="wheel">

          <circle r="82" fill="none" stroke="#fffaf0" stroke-width="5"/>
          <circle r="7" fill="#e8bd63" stroke="#263c3e" stroke-width="4"/>
          <g class="line" stroke="#789899" stroke-width="2.5">
            <path d="M0-82V82M-82 0H82M-58-58L58 58M-58 58L58-58M-76-32L76 32M-32-76L32 76M-76 32L76-32M-32 76L32-76"/>

        </g>
      </defs>

      <rect width="1200" height="760" fill="url(#sky)"/>
      <circle cx="1000" cy="122" r="53" fill="#f7d77b" opacity=".92"/>
      <circle cx="981" cy="104" r="6" fill="#ffe9ab" opacity=".75"/>

      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1380 0" dur="54s" repeatCount="indefinite"/>

        <use href="#cloud" x="1810" y="70" transform="scale(.74)"/>

        <animate attributeName="rx" values="210;200;210" dur=".8s" repeatCount="indefinite"/>
      </ellipse>

      <g id="bike" class="ink soft-shadow">
        <g transform="translate(433 558)">

            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.35s" repeatCount="indefinite"/>

          <path d="M548 532q10-9 19-1l24 10q4 8-7 9h-38q-8-9 2-18Z"/>

        <path d="M506 287Q557 273 590 312L620 383Q624 421 577 438L492 421Q459 390 470 345Z" fill="#fbfaf1" stroke-width="6"/>

        <path d="M572 259Q605 263 635 287Q619 310 596 323Q579 303 556 295Z" fill="#e7e2d2" stroke-width="4"/>
        <path d="M620 289Q666 288 724 313Q734 322 723 332L626 333Z" fill="#e9a55e" stroke-width="6"/>
        <path d="M714 313q25 10 32 20q-6 11-23 10l-21-11Z" fill="#d7824d" stroke-width="4"/>

        <circle cx="641" cy="278" r="3" fill="#fff" stroke="none"/>

        <path d="M476 340Q438 343 426 379Q446 399 484 382Z" fill="#f7f5eb" stroke-width="5">
          <animateTransform attributeName="transform" type="rotate" values="0 478 361;-5 478 361;0 478 361" dur="1.7s" repeatCount="indefinite"/>
        </path>
        <path d="M480 377Q526 392 579 373" fill="none" stroke="#d94f4d" stroke-width="18">
          <animateTransform attributeName="transform" type="rotate" values="0 520 375;3 520 375;0 520 375;-3 520 375;0 520 375" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M570 381q18 20 36 16l-7 43q-28 2-45-23Z" fill="#d94f4d" stroke-width="4">
          <animateTransform attributeName="transform" type="rotate" values="0 590 408;6 590 408;0 590 408" dur="1.4s" repeatCount="indefinite"/>
        </path>

        <path d="M510 350Q548 366 584 349L590 385Q548 403 511 383Z" fill="#fffdf6" stroke-width="5"/>
        <path d="M518 351Q542 362 563 353" class="line" stroke="#c1c8b8" stroke-width="4"/>
        <path d="M529 395L545 445" fill="none" stroke="#263c3e" stroke-width="10"/>
        <path d="M526 394L489 441" fill="none" stroke="#263c3e" stroke-width="10"/>
        <path d="M483 440l-25 17M545 444l28 17" fill="none" stroke="#263c3e" stroke-width="7"/>
      </g>

      <g opacity=".75" class="line" stroke="#fffdf4" stroke-width="4">
        <path d="M118 294q21-20 42 0q21-20 42 0"/>
        <path d="M1014 248q17-16 34 0q17-16 34 0"/>
      </g>
      <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#356568">
        <text x="72" y="92" font-size="22" letter-spacing="2">海风骑行</text>
        <text x="72" y="120" font-size="13" opacity=".72">PELICAN ON TWO WHEELS</text>
      </g>
    </svg>
  </main>
</body>
</html>
