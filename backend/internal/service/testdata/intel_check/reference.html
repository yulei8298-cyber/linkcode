<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8eee9">
  <title>自行车骑鹈鹕 · 海风骑行</title>
  <style>
    :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #274b46; background: #d8eee9; }
    * { box-sizing: border-box; }
    body { margin: 0; letter-spacing: 0; }
    main { position: relative; width: 100%; height: 100svh; min-height: 360px; overflow: hidden; }
    .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    header { position: absolute; top: max(30px, env(safe-area-inset-top)); left: max(32px, env(safe-area-inset-left)); pointer-events: none; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", serif; font-size: 28px; font-weight: 600; line-height: 1.4; }
    header p { margin: 9px 0 0; color: #4e7067; font-size: 12px; }
    footer { position: absolute; right: max(32px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); }
    .playback { display: flex; align-items: center; gap: 9px; min-height: 44px; font-size: 12px; cursor: pointer; user-select: none; }
    .playback input { appearance: none; width: 34px; height: 20px; margin: 0; padding: 3px; border: 1px solid #335a4f; border-radius: 20px; background: #cddccb; cursor: pointer; }
    .playback input::before { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #335a4f; }
    .playback input:checked { background: #335a4f; }
    .playback input:checked::before { transform: translateX(14px); background: #f4faf0; }
    .playback input:focus-visible { outline: 3px solid #db664f; outline-offset: 5px; }
    @media (max-width: 600px) { header { left: 24px; top: max(24px, env(safe-area-inset-top)); } h1 { font-size: 24px; } footer { right: 24px; } }
  </style>
</head>
<body>
  <main>
    <svg id="scene" class="scene" viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-description">

        </g>

        <path d="M446 646L530 700M966 656L875 700" fill="none" stroke="#71877a" stroke-width="3"/>

        <path d="M530 700L616 560L680 684H530L820 560H616M680 684L820 560L875 700" fill="none" stroke-width="16"/>
        <path d="M530 700L616 560L680 684H530L820 560H616M680 684L820 560L875 700" fill="none" stroke="#df6b54" stroke-width="10"/>
        <path d="M616 560L601 521M820 560L798 489Q794 476 813 476H843" fill="none" stroke-width="10"/>
        <path d="M819 489Q851 527 857 595" fill="none" stroke-width="2.5"/>
        <path d="M815 477H844" stroke="#9b6b4d" stroke-width="12"/>
        <path d="M578 513Q601 503 625 511Q635 521 621 526H581Q569 521 578 513Z" fill="#805c47" stroke-width="4"/>
        <path d="M472 575H568M482 575L514 605M557 575L575 632" fill="none" stroke-width="5"/>

          <path d="M580 431C620 409 655 442 697 454L815 470Q829 472 826 482Q823 488 810 484L701 480C661 485 626 477 600 464" fill="#eef1e4" stroke-width="4"/>

        <path id="leg-highlight" d="M618 502Q634 581 674 609L701 718" fill="none" stroke="#efcb75" stroke-width="5"/>

      <g id="speed-lines" fill="none" stroke="#f3f4db" stroke-width="4" stroke-linecap="round"><path d="M365 566H417M331 588H394M364 610H408"/></g>
      <g id="verge"><use href="#verge-tile" x="-960"/><use href="#verge-tile" x="-480"/><use href="#verge-tile"/><use href="#verge-tile" x="480"/><use href="#verge-tile" x="960"/><use href="#verge-tile" x="1440"/><use href="#verge-tile" x="1920"/><use href="#verge-tile" x="2400"/></g>
    </svg>
    <header><h1>海风骑行</h1><p>沿着海岸，慢慢向前。</p></header>
    <footer><label class="playback"><input id="playback" type="checkbox" role="switch" checked aria-label="播放动画"><span>播放</span></label></footer>
  </main>
  <script>
    (() => {
      "use strict";
      const scene = document.getElementById("scene");
      const playback = document.getElementById("playback");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const ids = ["rider", "shadow", "rear-spokes", "front-spokes", "crank-arm", "far-pedal", "near-pedal", "far-leg", "near-leg", "leg-highlight", "far-foot", "near-foot", "scarf-tail", "eye", "water", "road", "verge", "clouds-far", "clouds-near", "boat-hull", "distant-birds", "speed-lines"];
      const nodes = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
      const tau = Math.PI * 2;
      let elapsed = 0;
      let previous = null;
      let frame = null;

      function fitScene() {
        const ratio = scene.clientWidth / Math.max(1, scene.clientHeight);
        const width = ratio < 1 ? 940 : Math.max(1440, 960 * ratio);
        const height = width / ratio;
        scene.setAttribute("viewBox", `${720 - width / 2} ${490 - height / 2} ${width} ${height}`);
      }

      // Solve two fixed-length leg segments so each foot stays on its pedal.
      function leg(hip, foot, upper, lower) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * offset / distance, y: hip.y + dy * along / distance - dx * offset / distance };
        return `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`;
      }

      function paint(time) {
        const angle = time * tau / 1.35;
        const cx = 680;
        const cy = 684;
        const near = { x: cx + 39 * Math.cos(angle), y: cy + 39 * Math.sin(angle) };
        const far = { x: cx - 39 * Math.cos(angle), y: cy - 39 * Math.sin(angle) };
        const bob = Math.sin(angle * 2) * 2;
        const wheelRotation = time * 132;
        nodes.rider.setAttribute("transform", `translate(0 ${bob})`);
        nodes.shadow.setAttribute("rx", 251 + bob);
        nodes["rear-spokes"].setAttribute("transform", `rotate(${wheelRotation % 360})`);
        nodes["front-spokes"].setAttribute("transform", `rotate(${wheelRotation % 360})`);
        nodes["crank-arm"].setAttribute("d", `M${far.x} ${far.y}L${near.x} ${near.y}`);
        nodes["far-pedal"].setAttribute("d", `M${far.x - 14} ${far.y + 5}h30`);
        nodes["near-pedal"].setAttribute("d", `M${near.x - 14} ${near.y + 7}h34`);
        nodes["far-leg"].setAttribute("d", leg({ x: 642, y: 498 }, far, 121, 118));
        const nearLeg = leg({ x: 618, y: 502 }, near, 123, 120);
        nodes["near-leg"].setAttribute("d", nearLeg);
        nodes["leg-highlight"].setAttribute("d", nearLeg);
        nodes["far-foot"].setAttribute("d", `M${far.x - 4} ${far.y}h24`);
        nodes["near-foot"].setAttribute("d", `M${near.x - 5} ${near.y - 4}q12-6 24 2l9 7h-35Z`);
        const flutter = Math.sin(angle * 1.5);
        nodes["scarf-tail"].setAttribute("d", `M681 360C651 ${342 + flutter * 8} 623 ${372 - flutter * 11} 589 ${352 + flutter * 12}L602 ${374 + flutter * 9}L585 ${384 + flutter * 7}C624 ${400 - flutter * 10} 650 ${362 + flutter * 6} 681 379Z`);
        const blinkPhase = time % 4.8;
        const eyeScale = blinkPhase > 4.58 ? Math.max(.06, Math.abs(blinkPhase - 4.69) / .11) : 1;
        nodes.eye.setAttribute("transform", `translate(0 299) scale(1 ${eyeScale}) translate(0 -299)`);
        nodes.water.setAttribute("transform", `translate(${-((time * 22) % 320)} 0)`);
        nodes.road.setAttribute("transform", `translate(${-((time * 242) % 480)} 0)`);
        nodes.verge.setAttribute("transform", `translate(${-((time * 242) % 480)} 0)`);
        nodes["clouds-far"].setAttribute("transform", `translate(${Math.sin(time / 24) * 45} 0)`);
        nodes["clouds-near"].setAttribute("transform", `translate(${Math.sin(time / 18) * 70} 0)`);
        nodes["boat-hull"].setAttribute("transform", `translate(0 ${Math.sin(time * 1.6) * 3}) rotate(${Math.sin(time * 1.6) * 2})`);
        nodes["distant-birds"].setAttribute("transform", `translate(${Math.sin(time / 8) * 14} ${Math.sin(time * .8) * 5})`);
        nodes["speed-lines"].setAttribute("opacity", .4 + .2 * Math.sin(angle));
        nodes["speed-lines"].setAttribute("transform", `translate(${Math.sin(angle) * 7} 0)`);
      }

      function tick(timestamp) {
        if (previous !== null) elapsed += Math.min((timestamp - previous) / 1000, .05);
        previous = timestamp;
        paint(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (playback.checked && !document.hidden) frame = requestAnimationFrame(tick);
      }

      playback.checked = !reducedMotion.matches;
      playback.addEventListener("change", syncPlayback);
      reducedMotion.addEventListener("change", event => { playback.checked = !event.matches; syncPlayback(); });
      document.addEventListener("visibilitychange", syncPlayback);
      window.addEventListener("resize", fitScene);
      fitScene();
      paint(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
