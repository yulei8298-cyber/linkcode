<script>
(() => {
  'use strict';

  // 直接按字面 id 取节点：便于阅读，也让静态分析能追出被驱动的元素。
  const scene      = document.getElementById('scene');
  const rearWheel  = document.getElementById('rear-wheel');
  const frontWheel = document.getElementById('front-wheel');
  const crank      = document.getElementById('crank');
  const pelican    = document.getElementById('pelican');
  const hipTuft    = document.getElementById('hip-tuft');
  const shadow     = document.getElementById('shadow');
  const dash       = document.getElementById('dash');
  const eye        = document.getElementById('eye');
  const glint      = document.getElementById('glint');
  const scarfTail  = document.getElementById('scarf-tail');
  const scarfFold  = document.getElementById('scarf-fold');

  const cloudsFar  = document.getElementById('clouds-far');
  const cloudsNear = document.getElementById('clouds-near');
  const headland   = document.getElementById('headland');
  const ripples    = document.getElementById('ripples');
  const verge      = document.getElementById('verge');
  const fore       = document.getElementById('fore');

  const nearLeg    = document.getElementById('near-leg');
  const nearLegInk = document.getElementById('near-leg-ink');
  const nearCrank  = document.getElementById('near-crank');
  const nearCrankHl= document.getElementById('near-crank-hl');
  const nearFoot   = document.getElementById('near-foot');
  const farLeg     = document.getElementById('far-leg');
  const farLegInk  = document.getElementById('far-leg-ink');
  const farCrank   = document.getElementById('far-crank');
  const farFoot    = document.getElementById('far-foot');

  const TAU = Math.PI * 2;

  // 单一时钟推导出全部运动：踏频决定曲柄相位，齿比决定轮速，
  // 轮速再决定路面与景物的移动速度。这样腿、脚、曲柄、车轮、路面
  // 天然同步——不需要任何人工对齐，也不会随时间漂移。
  const CADENCE     = TAU / 1.5;        // 曲柄角速度（rad/s），1.5 秒一圈
  const GEAR_RATIO  = 1.5;              // 曲柄一圈 = 车轮 1.5 圈
  const WHEEL_R     = 95;               // 与 SVG 里的轮半径一致
  const ROAD_SPEED  = CADENCE * GEAR_RATIO * WHEEL_R;  // px/s，轮缘线速度

  const CRANK_R  = 40;                  // 曲柄长度
  const BB       = { x: 600, y: 600 };  // 五通（曲柄中心）
  const UPPER    = 115;                 // 大腿
  const LOWER    = 110;                 // 小腿

  /**
   * 两连杆逆向运动学：已知髋与踝的位置，解出膝的位置。
   * 踝点跟着踏板走，所以脚永远踩在踏板上；膝的弯曲方向取骑行前方。
   */
  function legPath(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const dist = Math.max(0.001, Math.hypot(dx, dy));
    const along = (UPPER * UPPER - LOWER * LOWER + dist * dist) / (2 * dist);
    const bend = Math.sqrt(Math.max(0, UPPER * UPPER - along * along));
    const kx = hip.x + along * dx / dist + bend * dy / dist;
    const ky = hip.y + along * dy / dist - bend * dx / dist;
    return `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)}` +
           `L${kx.toFixed(1)} ${ky.toFixed(1)}` +
           `L${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
  }

  function poseLeg(phase, hip, leg, ink, arm, armHl, foot) {
    const px = BB.x + Math.cos(phase) * CRANK_R;
    const py = BB.y + Math.sin(phase) * CRANK_R;
    // 踝在踏板上方一点：脚掌有厚度，直接连到踏板中心会显得穿模。
    const d = legPath(hip, { x: px, y: py - 12 });
    leg.setAttribute('d', d);
    ink.setAttribute('d', d);
    const armD = `M${BB.x} ${BB.y}L${px.toFixed(1)} ${py.toFixed(1)}`;
    arm.setAttribute('d', armD);
    if (armHl) armHl.setAttribute('d', armD);
    foot.setAttribute('transform', `translate(${px.toFixed(1)} ${(py - 12).toFixed(1)})`);
  }

  function shift(el, x) {
    el.setAttribute('transform', `translate(${(-x).toFixed(1)} 0)`);
  }

  function draw(t) {
    const phase = t * CADENCE;
    const travel = t * ROAD_SPEED;
    const bob = Math.sin(phase * 2) * 2.4;   // 每圈两次起伏，对应双脚各一次下压

    // 车轮：绕自身轮心转，转角由行进距离反推，与路面严格一致
    const roll = (travel / WHEEL_R) * 180 / Math.PI;
    rearWheel.setAttribute('transform', `rotate(${(roll % 360).toFixed(1)})`);
    frontWheel.setAttribute('transform', `rotate(${(roll % 360).toFixed(1)})`);
    crank.setAttribute('transform', `rotate(${(phase * 180 / Math.PI % 360).toFixed(1)})`);

    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    hipTuft.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    shadow.setAttribute('rx', (258 + bob * 1.6).toFixed(1));

    // 两腿相差半圈，保证始终一上一下
    poseLeg(phase + Math.PI, { x: 512, y: 428 + bob },
            farLeg, farLegInk, farCrank, null, farFoot);
    poseLeg(phase, { x: 525, y: 430 + bob },
            nearLeg, nearLegInk, nearCrank, nearCrankHl, nearFoot);

    // 视差：越远越慢。路面与车轮同速，前景略快于路面。
    shift(cloudsFar,  (travel * 0.016) % 1200);
    shift(cloudsNear, (travel * 0.028) % 1200);
    shift(headland,   (travel * 0.07)  % 1200);
    shift(ripples,    (travel * 0.16)  % 1200);
    shift(verge,      (travel * 0.62)  % 1200);
    shift(fore,       (travel * 1.25)  % 1200);
    dash.setAttribute('stroke-dashoffset', (travel % 200).toFixed(1));

    // 围巾随微风摆动
    const w = Math.sin(phase * 0.75) * 7;
    scarfTail.setAttribute('d',
      `M606 302C572 ${(286 + w).toFixed(1)} 556 ${(314 - w).toFixed(1)} 518 ${(292 + w).toFixed(1)}` +
      `L496 ${(303 + w).toFixed(1)}L509 ${(323 + w).toFixed(1)}` +
      `C548 ${(337 - w).toFixed(1)} 578 ${(313 + w).toFixed(1)} 610 320Z`);
    scarfFold.setAttribute('d',
      `M511 ${(309 + w).toFixed(1)}Q550 ${(326 - w).toFixed(1)} 594 307`);

    // 每 5.4 秒眨一次眼
    const b = t % 5.4;
    const k = b > 5.15 ? Math.max(0.08, Math.abs(b - 5.275) / 0.125) : 1;
    eye.setAttribute('ry', (9 * k).toFixed(2));
    glint.setAttribute('opacity', k > 0.5 ? '1' : '0');
  }

  let elapsed = 0;
  let prev = null;
  let frameId = null;

  function step(now) {
    if (prev !== null) elapsed += Math.min((now - prev) / 1000, 0.05);
    prev = now;
    draw(elapsed);
    frameId = requestAnimationFrame(step);
  }

  function start() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    prev = null;
    frameId = requestAnimationFrame(step);
  }

  function stop() {
    if (frameId !== null) cancelAnimationFrame(frameId);
    frameId = null;
    prev = null;
  }

  // 尊重系统的减少动效设置
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  function sync() {
    if (reduced.matches) { stop(); draw(elapsed); return; }
    if (document.hidden) { stop(); return; }
    start();
  }

  draw(0);
  // 初始启动不看 document.hidden：本文档可能被嵌在初始处于隐藏态的容器里，
  // 而 visibilitychange 在那种场合未必触发，若以它为启动条件，动画将永不开始。
  if (!reduced.matches) start();

  document.addEventListener('visibilitychange', sync);
  reduced.addEventListener('change', sync);
  window.addEventListener('pagehide', stop);
})();
</script>
</body>
</html>
