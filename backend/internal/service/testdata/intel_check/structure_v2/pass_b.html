  <style>
    :root { color-scheme: light; --ink: #293f3b; --sky: #dceee6; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--sky); color: var(--ink); }
    main { position: relative; width: 100%; height: 100%; min-height: 280px; }
    .scene { display: block; width: 100%; height: 100%; }
    .scene * { transform-box: view-box; transform-origin: 0 0; }
    .controls { position: absolute; right: 24px; bottom: 24px; }
    button {
      display: grid; place-items: center; width: 46px; height: 46px;
      padding: 0; color: var(--ink); background: #f8fbf3dd;
      border: 1px solid #293f3b40; border-radius: 50%; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #f8fbf3; }
    button:focus-visible { outline: 3px solid #dd6b59; outline-offset: 5px; }
    button svg { width: 19px; height: 19px; }
    .play-icon { display: none; }
    button[data-paused="true"] .play-icon { display: block; }
    button[data-paused="true"] .pause-icon { display: none; }
    @media (max-width: 600px) { .controls { right: 16px; bottom: 16px; } }
  </style>
</head>

    <div class="controls">

  <script>
    (() => {
      const animations = [];
      const cycle = 1600;
      const sampleCount = 96;
      const tau = Math.PI * 2;
      const byId = (id) => document.getElementById(id);
      const degrees = (radians) => radians * 180 / Math.PI;
      const transform = (x, y, angle = 0) =>
        `translate(${x.toFixed(3)}px, ${y.toFixed(3)}px) rotate(${angle.toFixed(3)}deg)`;

      function animate(id, frames, duration, options = {}) {
        const animation = byId(id).animate(frames, {
          duration, iterations: 1000000, fill: 'both', easing: 'linear', ...options,
        });
        animations.push(animation);
        return animation;
      }

      // Two-link inverse kinematics keeps each webbed foot on its pedal.
      function legFrames(phase) {
        const frames = { thigh: [], shin: [], foot: [] };
        for (let index = 0; index <= sampleCount; index += 1) {
          const time = index / sampleCount;
          const angle = time * tau + phase;
          const hip = { x: 578, y: 425 + Math.sin(time * tau * 2) * 2 };
          const foot = { x: 653 + Math.cos(angle) * 46, y: 553 + Math.sin(angle) * 46 };
          const dx = foot.x - hip.x;
          const dy = foot.y - hip.y;
          const distance = Math.hypot(dx, dy);
          const upperLength = 105;
          const lowerLength = 108;
          const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
          const height = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
          const knee = {
            x: hip.x + along * dx / distance + height * dy / distance,
            y: hip.y + along * dy / distance - height * dx / distance,
          };
          frames.thigh.push({ offset: time, transform: transform(hip.x, hip.y, degrees(Math.atan2(knee.y - hip.y, knee.x - hip.x))) });
          frames.shin.push({ offset: time, transform: transform(knee.x, knee.y, degrees(Math.atan2(foot.y - knee.y, foot.x - knee.x))) });
          frames.foot.push({ offset: time, transform: transform(foot.x, foot.y) });
        }
        return frames;
      }

      for (const [side, phase] of [['near', 0], ['far', Math.PI]]) {
        const frames = legFrames(phase);
        for (const part of ['thigh', 'shin', 'foot']) {
          byId(`${side}-${part}`).style.transform = frames[part][0].transform;
          animate(`${side}-${part}`, frames[part], cycle);
        }
      }

      animate('crank', [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], cycle);
      for (const wheel of ['rear-spokes', 'front-spokes']) {
        animate(wheel, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], 2400);
      }

      const bob = Array.from({ length: sampleCount + 1 }, (_, index) => ({
        offset: index / sampleCount,
        transform: `translateY(${(Math.sin(index / sampleCount * tau * 2) * 2).toFixed(3)}px)`,
      }));
      animate('pelican', bob, cycle);
      animate('hip-feathers', bob, cycle);
      byId('scarf-tail').style.transformOrigin = '702px 313px';
      animate('scarf-tail', [
        { transform: 'rotate(-4deg) scaleY(0.94)' },
        { transform: 'rotate(4deg) scaleY(1.05)' },
        { transform: 'rotate(-4deg) scaleY(0.94)' },
      ], 800, { easing: 'ease-in-out' });

      byId('eye').style.transformOrigin = '767px 250px';
      animate('eye', [
        { transform: 'scaleY(1)', offset: 0 },
        { transform: 'scaleY(1)', offset: 0.9 },
        { transform: 'scaleY(0.08)', offset: 0.925 },
        { transform: 'scaleY(1)', offset: 0.95 },
        { transform: 'scaleY(1)', offset: 1 },
      ], 4800);

      animate('road', [{ transform: 'translateX(0)' }, { transform: 'translateX(-240px)' }], 826);
      animate('water', [{ transform: 'translateX(0)' }, { transform: 'translateX(-360px)' }], 18000);
      animate('roadside', [{ transform: 'translateX(0)' }, { transform: 'translateX(-1440px)' }], 6000);
      animate('foreground', [{ transform: 'translateX(0)' }, { transform: 'translateX(-1440px)' }], 4500);
      animate('clouds-back', [{ transform: 'translateX(0)' }, { transform: 'translateX(-1440px)' }], 150000);
      animate('distant-birds', [
        { transform: 'translate(0, 0)' },
        { transform: 'translate(-10px, -5px)' },
        { transform: 'translate(0, 0)' },
      ], 6000, { easing: 'ease-in-out' });

      const playback = byId('playback');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;

      function setPaused(value) {
        paused = value;
        for (const animation of animations) {
          if (paused) animation.pause();
          else animation.play();
        }
        const label = paused ? '播放动画' : '暂停动画';
        playback.dataset.paused = String(paused);
        playback.setAttribute('aria-label', label);
        playback.title = label;
      }

      // A shared starting time keeps the crank, feet, and body synchronized.
      for (const animation of animations) animation.currentTime = 0;
      setPaused(paused);
      playback.addEventListener('click', () => setPaused(!paused));
      reducedMotion.addEventListener('change', (event) => setPaused(event.matches));
    })();
  </script>
