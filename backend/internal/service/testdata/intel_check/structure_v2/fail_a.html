<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root { background: #a9dce2; color: #183943; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #a9dce2; font-family: system-ui, sans-serif; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    svg { width: 100%; height: 100%; display: block; }
    .ink { stroke: #243f43; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.25s linear infinite; }
    .body-bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .75s ease-in-out infinite alternate; }
    .pedal-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.25s linear infinite; }
    .leg-a { transform-box: fill-box; transform-origin: 0 0; animation: legA 1.25s ease-in-out infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 0 0; animation: legB 1.25s ease-in-out infinite; }
    .scenery { animation: drift 16s linear infinite; }
    .wave-drift { animation: wave 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes legA { 0%,100% { transform: rotate(18deg); } 50% { transform: rotate(-28deg); } }
    @keyframes legB { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(18deg); } }
    @keyframes drift { to { transform: translateX(-420px); } }
    @keyframes wave { to { transform: translateX(-260px); } }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车沿海岸前进的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#94d4e2"/><stop offset="1" stop-color="#e8f3d4"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#65bdc5"/><stop offset="1" stop-color="#2e8b9c"/>
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#183943" flood-opacity=".23"/>
        </filter>
        <g id="cloud" fill="#fffdf4" opacity=".9">
          <path d="M0 35c0-14 11-24 25-24 6-18 33-20 43-3 8-7 18-10 29-7 12 4 18 15 18 28h12c10 0 18 7 18 15H0z"/>
        </g>
        <g id="wheel">
          <circle r="86" fill="#e7f0e4" stroke="#243f43" stroke-width="11"/>
          <circle r="75" fill="none" stroke="#a2c7be" stroke-width="4"/>
          <g class="line" stroke="#7aa4a2" stroke-width="3">
            <path d="M0-75V75M-75 0H75M-53-53L53 53M-53 53L53-53M-70-29L70 29M-29-70L29 70M-70 29L70-29M-29 70L29-70"/>
          </g>
          <circle r="7" fill="#e7b957" stroke="#243f43" stroke-width="4"/>
        </g>
      </defs>

      <rect width="1200" height="760" fill="url(#sky)"/>
      <circle cx="995" cy="120" r="57" fill="#ffe18d"/>
      <g class="scenery">
        <use href="#cloud" x="70" y="95" transform="scale(1.15)"/>
        <use href="#cloud" x="445" y="62" transform="scale(.72)"/>
        <use href="#cloud" x="830" y="165" transform="scale(.9)"/>
        <use href="#cloud" x="1320" y="98" transform="scale(1.15)"/>
        <use href="#cloud" x="1700" y="62" transform="scale(.72)"/>
      </g>

      <path d="M0 380Q150 360 300 382T600 379T900 382T1200 376V590H0Z" fill="url(#sea)"/>
      <g class="wave-drift line" stroke="#ccefe8" stroke-width="4" opacity=".78">
        <path d="M0 445h90m70 18h108m78-30h94m80 25h124m80-25h92m90 30h116m92-24h112m-1138 92h88m72 18h116m78-27h95m78 26h125m82-28h96m91 28h108m78-29h95"/>
      </g>
      <path d="M0 535Q150 515 310 538T620 535T930 532T1200 540V760H0Z" fill="#c4d9aa"/>
      <path d="M0 615Q170 588 330 614T650 610T970 608T1200 615V760H0Z" fill="#efe4bd"/>
      <g class="scenery" stroke="#588c67" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M70 653q-5-22-22-31M70 653q6-26 23-37M70 653q18-18 35-15M430 643q-4-20-19-29M430 643q7-23 22-32M430 643q16-16 31-12M980 650q-4-22-20-31M980 650q7-24 23-34M980 650q17-17 33-13M1390 653q-5-22-22-31M1390 653q7-26 24-37M1390 653q18-18 35-15"/>
      </g>

      <g transform="translate(600 475)" filter="url(#shadow)">
        <ellipse cx="0" cy="184" rx="260" ry="20" fill="#547b6a" opacity=".25"/>
        <g class="wheel-spin" transform="translate(-145 115)"><use href="#wheel"/></g>
        <g class="wheel-spin" transform="translate(153 115)"><use href="#wheel"/></g>

        <g class="ink" fill="none" stroke-width="8">
          <path d="M-145 115L-36 30L153 115L-145 115L-36 30L-5 115" stroke="#d07b48"/>
          <path d="M-36 30L-8 2M-8 2h55M-8 2l-18-25" stroke="#243f43"/>
          <path d="M153 115l-5-111M148 4h42M148 4l23-25" stroke="#243f43"/>
          <path d="M-36 30h75" stroke="#d07b48"/>
        </g>
        <circle cx="-5" cy="115" r="18" fill="#e7b957" stroke="#243f43" stroke-width="6"/>
        <g class="pedal-spin line" stroke="#243f43" stroke-width="6">
          <path d="M-5 115l31-20M-5 115l-29 20"/><path d="M26 95h25M-34 135h-25"/>
        </g>

        <g class="body-bob">
          <path d="M-80 28Q-105-57-45-96Q22-138 80-78Q104-52 91 21Z" fill="#f2eee1" class="ink" stroke-width="7"/>
          <path d="M-75-24Q-37-63 8-43Q45-26 76 20Q24 53-51 28Z" fill="#d8e3d9" class="ink" stroke-width="6"/>
          <path d="M-18-75Q-3-126 44-143Q80-157 106-129Q120-114 109-94Q98-72 63-67Z" fill="#f6f0df" class="ink" stroke-width="7"/>
          <path d="M80-118Q129-116 177-98Q198-90 177-74Q130-40 79-54Z" fill="#efad69" class="ink" stroke-width="7"/>
          <path d="M171-93q22 7 14 20q-11 16-29 11" fill="none" class="ink" stroke-width="6"/>
          <circle cx="81" cy="-112" r="8" fill="#243f43"/>
          <path d="M104-130q18-14 34-6" class="line" stroke="#d6a65f" stroke-width="5"/>
          <path d="M-53-68Q-16-22 22-20" class="line" stroke="#b7cfc4" stroke-width="7"/>
          <path d="M-56-8q-35 27-43 75" class="line" stroke="#efad69" stroke-width="13"/>
          <path d="M-95 67l-19 13m20-16l-5 20m8-19l10 16" class="line" stroke="#efad69" stroke-width="7"/>
          <path d="M51-3q30 27 42 64" class="line" stroke="#efad69" stroke-width="13"/>
          <path d="M93 61l-5 22m6-20l12 16m-10-18l20 8" class="line" stroke="#efad69" stroke-width="7"/>
          <path d="M-35-52Q16-36 71-58" class="line" stroke="#d94f4f" stroke-width="14"/>
          <path d="M52-49l20 29-13 27" fill="none" stroke="#d94f4f" stroke-width="10"/>

          <g class="leg-a line" stroke="#c9824d" stroke-width="12"><path d="M-34 72L-7 112"/><path d="M-7 112l-25 15" stroke-width="8"/></g>
          <g class="leg-b line" stroke="#c9824d" stroke-width="12"><path d="M30 73L5 112"/><path d="M5 112l25 15" stroke-width="8"/></g>
        </g>
      </g>

      <text x="52" y="70" fill="#23484c" font-size="25" font-weight="700" opacity=".75">COASTAL RIDE</text>
      <text x="54" y="106" fill="#23484c" font-size="15" letter-spacing="3" opacity=".6">PELICAN ON TWO WHEELS</text>
    </svg>
  </main>
</body>
</html>
