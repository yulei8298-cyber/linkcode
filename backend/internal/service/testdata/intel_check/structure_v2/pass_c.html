    main { display: grid; place-items: center; width: 100%; height: 100%; height: 100svh; overflow: hidden; }

    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }

  </main>
  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const parts = Object.fromEntries([
        'cloud-pattern', 'wave-pattern', 'verge-pattern', 'road-lines', 'road-grain',
        'rear-spokes', 'front-spokes', 'rider-body', 'eye', 'tail', 'scarf-long',
        'scarf-short', 'distant-birds', 'passing-flower'
      ].map((id) => [id, byId(id)]));
      const legs = ['near', 'far'].map((side, index) => ({
        phase: index * Math.PI,
        hipX: index ? 512 : 528,
        outline: byId(`${side}-leg-outline`),
        color: byId(`${side}-leg-color`),
        foot: byId(`${side}-foot`),
        crank: byId(`${side}-crank`)
      }));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const number = (value) => value.toFixed(2);
      let elapsed = 0;
      let previous = null;
      let frame = null;

      function draw(time) {
        const phase = time * TAU / 1.65;
        const distance = time * 205;
        const bob = Math.sin(phase * 2) * 2;
        const wheelAngle = number(distance / 100 * 180 / Math.PI);
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelAngle})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelAngle})`);
        parts['rider-body'].setAttribute('transform', `translate(0 ${number(bob)})`);
        parts['cloud-pattern'].setAttribute('patternTransform', `translate(${number(-(time * 11 % 1200))} 0)`);
        parts['wave-pattern'].setAttribute('patternTransform', `translate(${number(-(time * 32 % 320))} 0)`);
        parts['verge-pattern'].setAttribute('patternTransform', `translate(${number(-(distance * .65 % 400))} 0)`);
        parts['road-lines'].setAttribute('stroke-dashoffset', number(distance % 180));
        parts['road-grain'].setAttribute('stroke-dashoffset', number(distance % 300));
        parts['passing-flower'].setAttribute('transform', `translate(${number(1300 - ((distance * 1.1 + 200) % 1450))} 787)`);
        parts['distant-birds'].setAttribute('transform', `translate(0 ${number(Math.sin(time * 1.8) * 5)})`);

        // Solve two fixed-length leg segments; each ankle stays on its pedal.
        for (const leg of legs) {
          const angle = phase + leg.phase;
          const pedalX = 561 + Math.cos(angle) * 36;
          const pedalY = 599 + Math.sin(angle) * 36;
          const hipY = 442 + bob;
          const ankleY = pedalY - 10;
          const dx = pedalX - leg.hipX;
          const dy = ankleY - hipY;
          const span = Math.hypot(dx, dy);
          const bend = Math.sqrt(Math.max(0, 103 * 103 - span * span / 4));
          const kneeX = (leg.hipX + pedalX) / 2 + dy / span * bend;
          const kneeY = (hipY + ankleY) / 2 - dx / span * bend;
          const path = `M${leg.hipX} ${number(hipY)}L${number(kneeX)} ${number(kneeY)}L${number(pedalX)} ${number(ankleY)}`;
          leg.outline.setAttribute('d', path);
          leg.color.setAttribute('d', path);
          leg.foot.setAttribute('transform', `translate(${number(pedalX)} ${number(ankleY)})`);
          leg.crank.setAttribute('d', `M561 599L${number(pedalX)} ${number(pedalY)}`);
        }

        const flutter = Math.sin(phase * 1.8) * 7;
        parts['scarf-long'].setAttribute('d', `M593 320Q546 ${302 + flutter} 518 ${314 - flutter}Q492 ${324 - flutter} 470 ${307 + flutter}L474 ${334 + flutter}Q515 ${350 - flutter} 543 ${336 + flutter}Q567 330 597 341Z`);
        parts['scarf-short'].setAttribute('transform', `rotate(${number(Math.sin(phase * 1.8 + 1) * 5)} 590 333)`);
        parts.tail.setAttribute('transform', `rotate(${number(Math.sin(phase) * 2)} 405 382)`);
        const blinkTime = time % 4.7;
        const eyeScale = blinkTime > 4.35 && blinkTime < 4.55
          ? .08 + .92 * Math.abs(blinkTime - 4.45) / .1 : 1;
        parts.eye.setAttribute('transform', `translate(0 230) scale(1 ${number(eyeScale)}) translate(0 -230)`);
      }

      function animate(timestamp) {
        if (previous !== null) elapsed += Math.min((timestamp - previous) / 1000, .05);
        previous = timestamp;
        draw(elapsed);
        frame = requestAnimationFrame(animate);
      }

      function syncPlayback() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (!document.hidden && !reducedMotion.matches) frame = requestAnimationFrame(animate);
      }

      draw(0);
      reducedMotion.addEventListener('change', syncPlayback);
      document.addEventListener('visibilitychange', syncPlayback);
      syncPlayback();
    })();
  </script>
