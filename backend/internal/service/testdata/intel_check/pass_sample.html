    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .playback {

      bottom: max(22px, env(safe-area-inset-bottom)); width: 44px; height: 44px;

      border-radius: 50%; background: #ffffffb8; color: #283f43; cursor: pointer;
    }
    .playback:hover { background: #fff; }
    .playback:focus-visible { outline: 3px solid #dd665d; outline-offset: 4px; }

  <script>
    const svg = document.getElementById('scene');
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const button = document.getElementById('playback');
    const symbol = document.getElementById('playback-symbol');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const cycleDuration = 1.8;

    // Sample two fixed-length leg segments, keeping the ankles on the pedals.
    function legPose(angle) {
      const hip = { x: 552, y: 429 };
      const ankle = { x: 600 + 36 * Math.cos(angle), y: 548 + 36 * Math.sin(angle) };
      const thigh = 91;
      const shin = 91;
      const dx = ankle.x - hip.x;
      const dy = ankle.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
      const knee = {
        x: hip.x + along * dx / distance + bend * dy / distance,
        y: hip.y + along * dy / distance - bend * dx / distance
      };
      return `M${hip.x} ${hip.y}L${knee.x.toFixed(3)} ${knee.y.toFixed(3)}L${ankle.x.toFixed(3)} ${ankle.y.toFixed(3)}`;
    }

    for (const [id, offset] of [
      ['near-leg-outline', 0], ['near-leg-path', 0], ['far-leg-path', Math.PI]
    ]) {
      const path = document.getElementById(id);
      const animation = document.createElementNS(svgNamespace, 'animate');
      const poses = Array.from({ length: 97 }, (_, i) => legPose(i / 96 * Math.PI * 2 + offset));
      path.setAttribute('d', poses[0]);
      animation.setAttribute('attributeName', 'd');
      animation.setAttribute('values', poses.join(';'));
      animation.setAttribute('dur', `${cycleDuration}s`);
      animation.setAttribute('repeatCount', 'indefinite');
      animation.setAttribute('calcMode', 'linear');
      path.appendChild(animation);
    }

    function setPaused(paused) {
      if (paused) svg.pauseAnimations();
      else svg.unpauseAnimations();
      const label = paused ? '播放动画' : '暂停动画';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
      button.setAttribute('aria-pressed', String(paused));
      symbol.textContent = paused ? '\u25b6' : '\u275a\u275a';
    }

    svg.setCurrentTime(0);
    setPaused(reducedMotion.matches);
    button.addEventListener('click', () => setPaused(!svg.animationsPaused()));
    reducedMotion.addEventListener('change', event => setPaused(event.matches));
  </script>
